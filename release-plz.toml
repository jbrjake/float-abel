# release-plz (DESIGN.md § Release): the version and the CHANGELOG entry are derived from the
# conventional-commit log since the last release tag, and nobody types a version. git-only: the tag
# says what is released, never a registry, because crates.io is outside the release until the owner
# says (CLAUDE.md § Standing decisions); the base the first release counts from is the annotated tag
# v0.0.0 on the commit that laid the crate down, never built. A feat bumps the minor below 1.0 too
# (owner: "of course feats bump the minor"); a breaking change bumps the minor below 1.0 and the
# major from 1.0 on, release-plz's default and Cargo's rule (`breaking_always_increment_major` is the
# switch). cargo-semver-checks runs on every release PR, so a break a commit forgot to mark with `!`
# still raises the bump.
[workspace]
git_only = true
features_always_increment_minor = true
semver_check = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
release_always = true
dependencies_update = false
pr_branch_prefix = "release-plz-"
pr_labels = ["release"]

# The test crates never release. They are publish = false workspace members, which git-only mode
# would otherwise tag, and the git-only tag lookup runs before `release` is read, so each is also
# taken off git-only mode here; off it, a publish = false package is skipped outright.
[[package]]
name = "float-abel-noalloc"
git_only = false
release = false

[[package]]
name = "float-abel-golden"
git_only = false
release = false

# The entry's shape: the repo's `type(scope): subject` form grouped by type, breaking changes marked
# and never filtered out, newest first. The header is CHANGELOG.md's own, kept as it is.
[changelog]
protect_breaking_commits = true
sort_commits = "newest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^bench", group = "<!-- 6 -->Benchmarks" },
  { message = "^build", group = "<!-- 7 -->Build" },
  { message = "^ci", group = "<!-- 8 -->CI" },
  { message = "^chore\\(meshwork\\)", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore", group = "<!-- 9 -->Other" },
  { message = "^revert", group = "<!-- 10 -->Reverted" },
]
body = """

## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
{%- if commit.scope -%}
- *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% else -%}
- {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message }}
{% endif -%}
{% endfor -%}
{% endfor %}
"""
