# The architecture claim, DESIGN.md § Bit-identical across architectures: tests/golden/ hashes every
# tier's bytes and reads on fixed inputs, and the hash must equal tests/data/golden.sha256 on all
# seven targets. Its own workflow, apart from ci.yml, so that one runner's or emulator's outage never
# blocks the functional gate. The committed hash is the claim: a mismatch on any target is a finding
# to run down, never a reason to re-bless.
name: golden

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64 Linux, os: ubuntu-latest }
          - { name: x86_64 Windows, os: windows-latest }
          - { name: aarch64 macOS, os: macos-latest }
          - { name: aarch64 Linux, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version && rustc --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: golden-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: golden-${{ matrix.os }}-
      - run: cargo test --locked -p float-abel-golden

  # 32-bit pointers, no hardware u128, a software SHA-256: the test binary runs under wasmtime.
  wasm32:
    name: wasm32 (wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WASMTIME_VERSION: v49.0.2
      # sha256 of wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz: the release API's asset digest
      # (`gh api repos/bytecodealliance/wasmtime/releases/tags/${WASMTIME_VERSION}`). Bump both.
      WASMTIME_SHA256: a4d6e9e3a5a60f527cf7793d674c48930c80c2e8977995b8a275cad3254b9322
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain and the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
          cargo --version && rustc --version
      # Download to a file and check its digest before anything unpacks: a replaced release asset
      # fails here instead of running on the runner.
      - name: Install wasmtime
        run: |
          tarball="${RUNNER_TEMP}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          curl -sSfL -o "$tarball" "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz"
          echo "${WASMTIME_SHA256}  ${tarball}" | sha256sum -c -
          tar xJf "$tarball" -C "$RUNNER_TEMP"
          echo "${RUNNER_TEMP}/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: golden-wasm32-${{ hashFiles('Cargo.lock') }}
          restore-keys: golden-wasm32-
      - run: wasmtime --version
      - run: cargo test --locked -p float-abel-golden --target wasm32-wasip1

  # riscv64gc and big-endian s390x under QEMU: cross builds in its pinned Docker image and runs the
  # test binary through the image's qemu-user. s390x is what catches a byte-order slip.
  emulated:
    name: ${{ matrix.target }} (QEMU via cross)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [riscv64gc-unknown-linux-gnu, s390x-unknown-linux-gnu]
    env:
      CROSS_VERSION: v0.2.5
      # sha256 of cross-x86_64-unknown-linux-gnu.tar.gz, computed from the download: the release
      # predates the API's asset digest. The binary inside reports `cross 0.2.5`. Bump both.
      CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain and the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          cargo --version && rustc --version
      # Download to a file and check its digest before anything unpacks, as the wasm32 job does.
      - name: Install cross
        run: |
          tarball="${RUNNER_TEMP}/cross-${CROSS_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CROSS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" -C ~/.cargo/bin
          cross --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: golden-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: golden-${{ matrix.target }}-
      - run: cross test --locked -p float-abel-golden --target ${{ matrix.target }}
