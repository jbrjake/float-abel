# The architecture claim, DESIGN.md § Bit-identical across architectures: tests/golden/ hashes every
# tier's bytes and reads on fixed inputs, and the hash must equal tests/data/golden.sha256 on all
# seven targets. Its own workflow, apart from ci.yml, so that one runner's or emulator's outage never
# blocks the functional gate. The committed hash is the claim: a mismatch on any target is a finding
# to run down, never a reason to re-bless.
name: golden

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: golden-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: x86_64 Linux, os: ubuntu-latest }
          - { name: x86_64 Windows, os: windows-latest }
          - { name: aarch64 macOS, os: macos-latest }
          - { name: aarch64 Linux, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version && rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: golden-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: golden-${{ matrix.os }}-
      - run: cargo test --locked -p float-abel-golden

  # 32-bit pointers, no hardware u128, a software SHA-256: the test binary runs under wasmtime.
  wasm32:
    name: wasm32 (wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WASMTIME_VERSION: v49.0.2
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain and the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-wasip1
          cargo --version && rustc --version
      - name: Install wasmtime
        run: |
          curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" | tar xJ
          echo "${PWD}/wasmtime-${WASMTIME_VERSION}-x86_64-linux" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: golden-wasm32-${{ hashFiles('Cargo.lock') }}
          restore-keys: golden-wasm32-
      - run: wasmtime --version
      - run: cargo test --locked -p float-abel-golden --target wasm32-wasip1

  # riscv64gc and big-endian s390x under QEMU: cross builds in its pinned Docker image and runs the
  # test binary through the image's qemu-user. s390x is what catches a byte-order slip.
  emulated:
    name: ${{ matrix.target }} (QEMU via cross)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [riscv64gc-unknown-linux-gnu, s390x-unknown-linux-gnu]
    env:
      CROSS_VERSION: v0.2.5
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain and the target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
          cargo --version && rustc --version
      - name: Install cross
        run: |
          curl -sSfL "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C ~/.cargo/bin
          cross --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: golden-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: golden-${{ matrix.target }}-
      - run: cross test --locked -p float-abel-golden --target ${{ matrix.target }}
