# The release, cut from the conventional-commit log counted from 0.0.0 over every commit since the
# first (DESIGN.md § Release; scripts/version-from-log.sh). The release PR against dev is not this
# workflow's: scripts/release-pr.sh cuts it from a clone under the developer's own gh login, because
# a commit and a pull request carry no identity a runner could add, and no runner holds write access
# to the repository for them. The attestation does carry the runner's identity, so that step is here.
#
#   the push to main      the dev→main merge: refuses a Cargo.toml that disagrees with the count and,
#                         when the version has no tag yet, builds the .crate from that commit with
#                         --locked, attests its provenance with GitHub artifact attestations, then
#                         creates the tag and the GitHub Release with the entry as its notes and the
#                         .crate, its sha256 and the attestation attached
#
# A push to dev is just a push and starts nothing here; ci.yml tests dev nightly and on the pull
# request into main. Nothing runs here but git, cargo and gh on the runner, the repository's own
# scripts, and the two GitHub-owned actions already pinned in this repository: the project's posture
# is no dependency it does not need, in the build as in the crate. crates.io is outside the release
# until the owner says (CLAUDE.md § Standing decisions); publish.yml is that step, on its own dispatch.
name: release

on:
  push:
    branches: [main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release on main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # the tag, the GitHub Release and its assets
      id-token: write      # the attestation's Sigstore signing
      attestations: write  # the provenance attestation
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version && rustc --version
      # A main whose Cargo.toml disagrees with the count had dev merged before the release PR; the
      # job stops there rather than tag the wrong number. A version with its tag is already released.
      - name: The version Cargo.toml carries is the one the log counts to
        id: version
        run: |
          counted=$(./scripts/version-from-log.sh)
          carried=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [ "$counted" != "$carried" ]; then
            echo "release: Cargo.toml says $carried but the log counts to $counted; merge the release PR into dev before merging dev into main" >&2
            exit 1
          fi
          echo "version=$counted" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$counted" >/dev/null; then
            echo "release: v$counted is already released"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$counted" >> "$GITHUB_OUTPUT"
          fi
      # The entry is read before anything is built or published, so a CHANGELOG.md without one stops
      # the job with no tag made.
      - name: Read the entry for the release notes
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { p = 1; print; next } /^## \[/ { p = 0 } p { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "release: CHANGELOG.md carries no entry for $VERSION" >&2
            exit 1
          fi
      # cargo package builds the archive from this commit's tree and lockfile, builds it once more
      # from the archive to verify it, and leaves it at target/package/. The attestation is of that
      # file. Both come before the tag: nothing is published until the artifact exists.
      - name: Package the .crate with the lockfile
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo package --locked
          (cd target/package && sha256sum float-abel-"$VERSION".crate | tee float-abel-"$VERSION".crate.sha256)
      - name: Attest the .crate's provenance
        if: steps.version.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/float-abel-*.crate
      - name: Create the tag and the GitHub Release, with the entry as its notes and the .crate attached
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            target/package/float-abel-*.crate target/package/float-abel-*.crate.sha256
