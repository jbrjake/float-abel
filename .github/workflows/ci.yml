# The functional gate, in CI. The gate job runs the same scripts the git hooks run, so local and
# remote green have one definition, less the task store's lint, which smoke.sh skips under CI
# because no job installs meshwork. The other jobs cover what a local run may skip: the MSRV build
# on exactly the default features, cargo-deny, and on the one toolchain dbsp builds on, the dbsp
# feature and the compile-fail wording. Benchmarks and the golden hash have their own workflows.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: smoke + regression (stable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          cargo --version && rustc --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: gate-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: gate-${{ runner.os }}-
      - run: ./scripts/smoke.sh
      - run: ./scripts/regression.sh

  msrv:
    name: MSRV 1.74 on the default features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install rustc 1.74.0
        run: |
          rustup toolchain install 1.74.0 --profile minimal
          rustup default 1.74.0
          cargo --version && rustc --version
      - run: cargo build --locked
      - run: cargo build --locked --no-default-features

  # The action's default arguments are `--all-features`, which would override deny.toml's graph
  # (every feature but dbsp), so the config is named instead.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --config deny.toml

  # dbsp declares rust-version 1.96.1 and builds there and on 1.99.0; rustc 1.97 and 1.98 ICE
  # inside it, so this job pins rather than tracking stable. The gate job's clippy never sees the
  # feature (it is out of the self dev-dependency's list), so this job lints it too, and runs the
  # UDA example, which the `--test main` filter never builds. The same pin is the release tests/ui's
  # .stderr files are blessed on (BLESSED_RUSTC in tests/ui.rs), with rust-src, which the blessed
  # wording renders core's source through; so the compile-fail wording is asserted here, where the
  # gate job, on a moving stable without rust-src, only runs the pass cases.
  dbsp:
    name: dbsp feature and compile-fail wording on rustc 1.99.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The dbsp closure is some five hundred crates, and the hosted runner's root disk shares its
      # headroom with the image's preinstalled tools, so the trees this job never reads go first:
      # the Android SDK, the .NET SDKs, GHCup's Haskell and the CodeQL bundle, at the paths the
      # image's own build scripts install them to. `df -h` before and after puts the headroom in
      # the log as a number.
      - name: Free the runner's disk
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup "$RUNNER_TOOL_CACHE/CodeQL"
          df -h
      - name: Install rustc 1.99.0 with rust-src
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rust-src
          rustup default 1.99.0
          cargo --version && rustc --version
      # No restore-keys: a lockfile change builds from a clean target, not on top of the previous
      # closure's artifacts, which a restored near-miss would leave on the disk beside the new ones.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: dbsp-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --locked --features dbsp --all-targets -- -D warnings
      - run: cargo test --locked --features dbsp --test main dbsp_
      - run: cargo run --locked --features dbsp --example dbsp_uda
      # The compile-fail cases on the test features a bare `cargo test` has, the set that blessed
      # their .stderr files; the dbsp one ran under the `dbsp_` filter above.
      - run: cargo test --locked --test main ui_
      # The dbsp closure's licences, duplicate majors and advisories, stated in deny-dbsp.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --config deny-dbsp.toml

  # Undefined behaviour under the interpreter, DESIGN.md § Hardening: the lib's unit tests, the
  # no-feature build and the integration suite. Under `cfg(miri)` the statistical sweeps run a
  # hundredth of their rounds, because miri runs a limb operation some thousand times slower than
  # the machine does; trybuild (spawns cargo) and the timely topics (three worker threads) are
  # ignored, the laws kit is out (a proptest case runs minutes under the interpreter), and every
  # bulk entry takes the portable kernel, because miri interprets no vector intrinsic. The dbsp
  # feature stays out: its toolchain is pinned, and nothing in it reads bytes from outside except
  # through `Exact::from_bytes`, which the suite covers.
  miri:
    name: cargo miri test (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install nightly with miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri,rust-src
          rustup default nightly
          cargo miri setup
          cargo --version && rustc --version && cargo miri --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: miri-${{ hashFiles('Cargo.lock') }}
          restore-keys: miri-
      - run: cargo miri test --locked --lib
      - run: cargo miri test --locked -p float-abel-noalloc
      - run: cargo miri test --locked --test main
