# Cuts releases from the conventional-commit log (DESIGN.md § Release). On a push to dev,
# `release-plz release-pr` opens or refreshes the release PR against dev, carrying the version and
# the CHANGELOG entry the log since the last tag yields. On a push to main, the dev→main merge,
# `release-plz release` tags vX.Y.Z and publishes the GitHub Release when Cargo.toml's version has no
# tag yet, and the same job then builds the .crate from that tag with --locked, attests its
# provenance with GitHub artifact attestations (Sigstore, bound to this repository, this workflow
# and the commit) and attaches the .crate, its sha256 and the attestation to the release. git-only:
# the tag says what is released, never a registry, because crates.io is outside the release until
# the owner says (CLAUDE.md § Standing decisions). The tools come through taiki-e/install-action,
# whose manifest pins a sha256 per platform for each version named, so the binaries are pinned by
# hash like the actions are.
name: release-plz

on:
  push:
    branches: [dev, main]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: release PR against dev
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write       # the release-plz-* branch
      pull-requests: write  # the release PR
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # every tag and the whole log, which the version is read from
          persist-credentials: false
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version && rustc --version
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: release-plz@0.4.2,cargo-semver-checks@0.51.0
      # release-plz commits through the GraphQL API, so the commit is GitHub-signed; the identity
      # below is for the temporary local repository it diffs in. A PR opened with GITHUB_TOKEN runs
      # no workflows, so the release PR gets ci once the owner stores a GitHub App or fine-grained
      # PAT token as RELEASE_PLZ_TOKEN; until then the PR still opens.
      - name: release-plz release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release-plz release-pr --git-token "$GITHUB_TOKEN" --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -o json | tee release-pr.json
          jq -e '.prs' release-pr.json >/dev/null

  release:
    name: release on main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # the tag, the GitHub Release and its assets
      id-token: write      # the attestation's Sigstore signing
      attestations: write  # the provenance attestation
    concurrency:
      group: release-plz-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version && rustc --version
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: release-plz@0.4.2
      # Tags vX.Y.Z and publishes the GitHub Release when the version has no tag; an empty
      # `releases` means main moved without a version change and the steps below are skipped.
      - name: release-plz release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release-plz release --git-token "$GITHUB_TOKEN" -o json | tee release.json
          tag=$(jq -r '.releases[0].tag // empty' release.json)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # The tag was made through the API, so the local clone learns its commit from the API too.
      # The commit is already here: release-plz tags the merged release PR's last commit or main's
      # head, both in the clone's history.
      - name: Package the .crate from the tag
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')
          type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type')
          if [ "$type" = "tag" ]; then
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha')
          fi
          git checkout --quiet "$sha"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "float-abel") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "release-plz: tag $TAG does not name Cargo.toml's version $version at $sha" >&2
            exit 1
          fi
          cargo package --locked
          (cd target/package && sha256sum float-abel-"$version".crate | tee float-abel-"$version".crate.sha256)
      - name: Attest the .crate's provenance
        if: steps.release.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/float-abel-*.crate
      - name: Attach the .crate and its sha256 to the release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "$TAG" target/package/float-abel-*.crate target/package/float-abel-*.crate.sha256 --clobber
