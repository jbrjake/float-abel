# Cuts releases from the conventional-commit log, counted from 0.0.0 over every commit since the
# first (DESIGN.md § Release; scripts/version-from-log.sh). On the owner's dispatch, run on dev, the
# release PR against dev is opened or refreshed with the count written into Cargo.toml and Cargo.lock
# and the entry for the commits since the last tag written into CHANGELOG.md
# (scripts/prepare-release.sh); a push to dev is just a push and starts nothing here. On a push to
# main, the dev→main merge, the job refuses a Cargo.toml that disagrees with the count and, when the
# version has no tag yet, creates the tag and the GitHub Release with the entry as its notes, builds
# the .crate from that commit with --locked, attests its provenance with GitHub artifact attestations
# and attaches the .crate, its sha256 and the attestation. Nothing runs here but git, cargo and gh on
# the runner, the repository's own scripts, and the two GitHub-owned actions already pinned in this
# repository: the project's posture is no dependency it does not need, in the build as in the crate.
# crates.io is outside the release until the owner says (CLAUDE.md § Standing decisions).
name: cut-release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  release-pr:
    name: release PR against dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # the release/next branch
      pull-requests: write  # the release PR
    concurrency:
      group: cut-release-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # every commit since the first, and the tags
          persist-credentials: false
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version && rustc --version
      - name: Prepare the release the log counts to
        id: prepare
        run: |
          set -o pipefail
          version=$(./scripts/prepare-release.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- Cargo.toml Cargo.lock CHANGELOG.md; then
            echo "pending=false" >> "$GITHUB_OUTPUT"
            echo "cut-release: $version is in place; no release PR to open"
          else
            echo "pending=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- Cargo.toml Cargo.lock CHANGELOG.md
          fi
      # The release PR's commit is the workflow's. With RELEASE_PR_TOKEN, a GitHub App or
      # fine-grained PAT with contents and pull-requests read/write, the PR runs ci, since a PR made
      # with GITHUB_TOKEN runs no workflows; and GITHUB_TOKEN can open one only when the repository
      # lets Actions create pull requests. The token reaches git through the push URL alone.
      - name: Open or refresh the release PR
        if: steps.prepare.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -B release/next
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -q -m "chore(release): v$VERSION"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release/next
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { p = 1; print; next } /^## \[/ { p = 0 } p { print }' CHANGELOG.md > "$RUNNER_TEMP/entry.md"
          pr=$(gh pr list --head release/next --base dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "chore(release): v$VERSION" --body-file "$RUNNER_TEMP/entry.md"
          else
            gh pr create --base dev --head release/next --title "chore(release): v$VERSION" --body-file "$RUNNER_TEMP/entry.md"
          fi

  release:
    name: release on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # the tag, the GitHub Release and its assets
      id-token: write      # the attestation's Sigstore signing
      attestations: write  # the provenance attestation
    concurrency:
      group: cut-release-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version && rustc --version
      # A main whose Cargo.toml disagrees with the count had dev merged before the release PR; the
      # job stops there rather than tag the wrong number. A version with its tag is already released.
      - name: The version Cargo.toml carries is the one the log counts to
        id: version
        run: |
          counted=$(./scripts/version-from-log.sh)
          carried=$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [ "$counted" != "$carried" ]; then
            echo "cut-release: Cargo.toml says $carried but the log counts to $counted; merge the release PR into dev before merging dev into main" >&2
            exit 1
          fi
          echo "version=$counted" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$counted" >/dev/null; then
            echo "cut-release: v$counted is already released"
            echo "tag=" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$counted" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the tag and the GitHub Release with the entry as its notes
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" 'index($0, "## [" v "]") == 1 { p = 1; print; next } /^## \[/ { p = 0 } p { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "cut-release: CHANGELOG.md carries no entry for $VERSION" >&2
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
      # cargo package builds the archive from this commit's tree and lockfile, builds it once more
      # from the archive to verify it, and leaves it at target/package/. The attestation is of that file.
      - name: Package the .crate with the lockfile
        if: steps.version.outputs.tag != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cargo package --locked
          (cd target/package && sha256sum float-abel-"$VERSION".crate | tee float-abel-"$VERSION".crate.sha256)
      - name: Attest the .crate's provenance
        if: steps.version.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/float-abel-*.crate
      - name: Attach the .crate and its sha256 to the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release upload "$TAG" target/package/float-abel-*.crate target/package/float-abel-*.crate.sha256 --clobber
