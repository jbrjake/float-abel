# The fuzz targets, DESIGN.md § Hardening: cargo-fuzz runs each for ten minutes nightly and on
# demand, and on every push the targets build, so none can rot between nights. A crash is an
# artifact to download and commit as a regression test under tests/, never a reason to loosen the
# target. Its own workflow, apart from ci.yml, because a nightly run is not a gate on a push.
name: fuzz

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [decode_robustness, sum_vs_oracle, sub_roundtrip]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default nightly
          cargo install cargo-fuzz@0.13.2 --locked
          cargo --version && rustc --version && cargo fuzz --version
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            fuzz/target
          key: fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: fuzz-
      - run: cargo fuzz build ${{ matrix.target }}
      - name: Run for ten minutes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=600
      - name: Keep the crash
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
