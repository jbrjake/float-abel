# The architecture claim, DESIGN.md § Bit-identical across architectures: one SHA-256 over every
# tier's canonical bytes and reads on fixed inputs, asserted against tests/data/golden.sha256. Its
# own workspace member, like tests/noalloc, because it has to build where tests/main.rs cannot: that
# target links trybuild, timely and differential-dataflow, whose tests spawn threads and processes,
# while wasm32 under wasmtime and the QEMU targets under cross can run the lib plus a hasher.
[package]
name = "float-abel-golden"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
publish = false
autotests = false

[dependencies]
# `simd` on, so the hash covers every kernel: NEON on aarch64, AVX2 on x86_64 that has it, and the
# portable kernel everywhere else, each landing the bits the one-at-a-time deposits land.
float-abel = { path = "../..", features = ["simd"] }
# Reads the two committed vector files, as tests/main.rs does.
serde_json = "1"
# The digest. 0.10, not 0.11: 0.11 declares rust-version 1.85, and cargo 1.74 parses every manifest
# in Cargo.lock, so the MSRV build of the root package would fail on a lockfile that names it.
sha2 = "0.10"

[[test]]
name = "main"
path = "main.rs"

[lints]
workspace = true
