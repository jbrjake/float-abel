# cargo-deny over every feature, the dbsp closure included: `cargo deny --config deny-dbsp.toml check`,
# run by the dbsp CI job and the push gate. deny.toml checks every feature but `dbsp` and is the
# crate's posture; this file states what dbsp 0.367's own closure carries (owner: "follow your rec
# on dbsp's CI job"), each row naming the crate that drags it, so a re-pin that brings a new
# licence, duplicate or advisory still fails here.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

# deny.toml's two ignores, present here because the differential closure is in this graph too, and
# the four dbsp's closure carries. rkyv 0.7 is dbsp 0.367's own archive format and the version this
# crate's `rkyv` line must resolve to; `Exact`'s archived form is six integers with no pointer in
# it, so the shared-pointer validation flaw is not reachable through this crate's archive. h2 0.3 is
# actix-http 3's HTTP/2, the server side of feldera-types, which this crate never opens; the h2 0.4
# beside it is past the fix. proc-macro-error is utoipa-gen's, a proc macro that runs at build time.
# zstd 0.12 is dbsp's own direct dependency, the one zstd in the graph without an in-range fix; this
# crate opens no zstd stream. Every row here is a crate that has to move upstream, so both gates run
# `check -D advisory-not-detected`: the day the crate moves on, the row stops matching and the gate
# fails until it is deleted (owner: "we need something to auto-trigger to remove the exception").
[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 is timely's serialized exchange, reached only through differential-dataflow" },
  { id = "RUSTSEC-2024-0436", reason = "paste 1.0.15 is columnation's and differential-dataflow's macro helper, reached only through differential-dataflow" },
  { id = "RUSTSEC-2026-0235", reason = "rkyv 0.7.46 is dbsp 0.367.0's storage format (dbsp, feldera-storage and ordered-float are on it), and Exact's archive holds no pointer; fixed upstream only in 0.8" },
  { id = "RUSTSEC-2026-0258", reason = "h2 0.3.27 is actix-http 3.20's, reached through actix-web and feldera-types from dbsp; no HTTP connection is opened by this crate, and the fix is in the 0.4 line hyper is on" },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error 1.0.4 is utoipa-gen 4.3's, reached through utoipa, feldera-ir and feldera-types from dbsp; a proc macro that runs at build time" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 6.0.6 is zstd 0.12.4's, dbsp's own direct dependency (zstd ^0.12, every release through 0.375.0); this crate decompresses nothing, and the fix is in the 8.2 line" },
]

# deny.toml's three, then the nine the dbsp closure carries, each with the crates that carry it.
# MPL-2.0 is file-level copyleft, allowed for this closure alone (owner: "Allow MPL-2.0 in
# deny-dbsp.toml"); deny.toml keeps rejecting it.
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSD-3-Clause",         # alloc-no-stdlib, alloc-stdlib, aws-lc-sys, brotli, encoding_rs, snap, subtle, zstd 0.14, zstd-safe 7, zstd-safe 8, zstd-sys
  "ISC",                  # aws-lc-rs, aws-lc-sys, rustls-webpki, untrusted
  "Zlib",                 # foldhash, zlib-rs
  "MIT-0",                # aws-lc-sys, ppmd-rust
  "CC0-1.0",              # ppmd-rust
  "BSL-1.0",              # xxhash-rust
  "CDLA-Permissive-2.0",  # webpki-root-certs
  "bzip2-1.0.6",          # libbz2-rs-sys
  "MPL-2.0",              # colored, feldera-observability's
]
confidence-threshold = 0.8

# Every duplicate major in the closure, the older one(s) skipped by name with what is on each side
# ("on it" is the skipped version). Everything named is reached through dbsp unless the row says
# otherwise; proptest is the laws feature's, serde_derive and derive_arbitrary are this crate's.
[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  { crate = "syn@2", reason = "columnar_derive 0.13, reached only through differential-dataflow, is on syn 2 while serde_derive and thiserror-impl are on syn 3" },
  { crate = "ahash@0.7", reason = "hashbrown 0.12.3 on it; hashbrown 0.13.2, hashbrown 0.14.5, metrics 0.23.1, quick_cache 0.6.24 on 0.8.12; through dbsp" },
