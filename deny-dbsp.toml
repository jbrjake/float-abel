  { crate = "itertools@0.14", reason = "dbsp 0.367.0, feldera-samply 0.367.0, feldera-storage 0.367.0, timely 0.31.0 on it; object_store 0.14.2 on 0.15.0; through dbsp and differential-dataflow" },
  { crate = "nix@0.27", reason = "feldera-storage 0.367.0 on it; object_store 0.14.2, zip 9.0.5 on 0.31.3; through dbsp" },
  { crate = "nix@0.29", reason = "dbsp 0.367.0, feldera-samply 0.367.0 on it; object_store 0.14.2, zip 9.0.5 on 0.31.3; through dbsp" },
