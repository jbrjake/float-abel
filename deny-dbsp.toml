  { crate = "hashbrown@0.13", reason = "feldera-size-of 0.1.7 on it; indexmap 2.14.2 on 0.17.1; through dbsp" },
  { crate = "hashbrown@0.14", reason = "dashmap 5.5.3, dbsp 0.367.0 on it; indexmap 2.14.2 on 0.17.1; through dbsp" },
