[package]
name = "float-abel"
version = "0.0.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "Exact abelian-group sums of f64, so an incremental engine lands the same bits under any order, worker count or architecture"
repository = "https://github.com/jbrjake/float-abel"
readme = "README.md"
categories = ["no-std", "mathematics", "data-structures", "algorithms"]
keywords = ["float", "reproducible", "abelian", "differential-dataflow", "dbsp"]
include = ["src/**", "Cargo.toml", "README.md", "FORMAT.md", "LICENSE-MIT", "LICENSE-APACHE"]
# One integration-test target. Topics are flat files under tests/, each a `mod` of tests/main.rs;
# discovery is off so a second file can never become a second binary.
autotests = false

# docs.rs builds every feature but `dbsp`, whose toolchain is pinned (rustc 1.97 and 1.98 ICE inside
# dbsp) where docs.rs's is not.
[package.metadata.docs.rs]
features = ["std", "serde", "differential", "laws", "simd", "arbitrary"]
rustdoc-args = ["--cfg", "docsrs"]

# Zero required dependencies (DESIGN.md § Crate posture). Everything below is optional and owned by
# exactly one feature.
[dependencies]
arbitrary = { version = "1", optional = true }
# The engine the `differential` feature adapts `Exact` to. A caret on the minor, not an exact pin,
# so a consumer's own 0.25.x unifies with it: the impls are a diff type's traits, which that
# consumer's dataflow has to see as one crate. Its closure reaches timely 0.31, whose serialized
# exchange is bincode 1, and columnation, which is on paste; both are ignored by id in deny.toml.
differential-dataflow = { version = "0.25", optional = true }
# The engine the `dbsp` feature adapts `Exact` to, DESIGN.md § DBSP. A caret on the minor, the
# differential shape, so a consumer's own 0.364.x unifies with it; the probe the adapter is
# written against runs at the floor of the range, and moving the floor means re-running it there
# first. dbsp is edition 2024 and declares rust-version 1.96.1; rustc 1.97 and 1.98 ICE inside
# it, so the feature builds on 1.96.1 and 1.99.0 and its CI job pins 1.99.0.
dbsp = { version = "0.364", optional = true }
# dbsp's storage traits on `Exact`: its archived form is rkyv's derive, on the features dbsp
# itself sets so the two resolve to one rkyv, and `SizeOf` is feldera's fork of size-of under the
# name dbsp gives it. Both on a caret so they unify with whatever dbsp's own closure picks.
rkyv = { version = "0.7", optional = true, default-features = false, features = ["std", "size_64"] }
size-of = { package = "feldera-size-of", version = "0.1.7", optional = true }
# The laws kit's property tester, re-exported from `float_abel::laws` so a stranger's strategies
# and ours agree on one proptest. `std` alone: the default `fork` and `timeout` features drag in
# rusty-fork, tempfile and wait-timeout, which the kit never uses. The floor is the release the kit
# was written against; it needs `Config::rng_seed`, the fixed seed CI runs with. Cargo.lock holds
# 1.11.0 on purpose (`cargo update -p proptest --precise 1.11.0`): 1.12 moves to rand 0.10, whose
# closure (rand_core, getrandom 0.4, chacha20, rand_xorshift 0.5) is edition 2024, and cargo 1.74
# parses every locked manifest on a normal edge, optional features included, so the MSRV build of
# the default features fails on a lockfile that names them even though it never compiles them.
proptest = { version = "1.11", optional = true, default-features = false, features = ["std"] }
serde = { version = "1", optional = true, default-features = false }

# The crate lists itself with the test features on: the one Cargo spelling that turns them on for a
# bare `cargo test` with no flag. `dbsp` stays out because it needs its own toolchain (rustc 1.97
# and 1.98 ICE inside dbsp), so a bare `cargo test` stays green on any stable.
[dev-dependencies]
float-abel = { path = ".", features = ["serde", "differential", "laws", "simd", "arbitrary"] }
# The differential oracle for `Wide`'s limbs: the same multiset must land the same 272 limb bytes.
# Pinned to the version tests/data/bitrep/vectors.json was taken from.
bitrep = "=0.5.1"
# A maintained `no_std` serde format that writes a tuple's elements back to back with no length
# prefix, so tests/wire.rs can assert its bytes equal `to_bytes`. Pinned because the assertion is
# about its framing.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
# Reads the committed conformance vectors.
serde_json = "1"
# The runtime tests/differential.rs and examples/dd_sum.rs execute a dataflow on: the version
# differential-dataflow 0.25 depends on, which it does not re-export.
timely = "0.31"
# trybuild hands a case the dev-dependencies alone, so the compile-fail case that opens a
# collection with `Binned<3>` as its diff needs the engine here too. It unifies with the optional
# dependency above.
differential-dataflow = "0.25"
# Compile-fail cases under tests/ui/: the `const` assertions that pin a conversion or a trait to
# the types it is sound for. Pinned because the `.stderr` files are matched against its
# normalisation of the compiler's output.
trybuild = "=1.0.122"
# benches/simd.rs. Pinned so a baseline and a re-run agree on the harness; no default features,
# because the plotters and rayon closure is a tenth of a second of plots nobody reads in CI.
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[test]]
name = "main"
path = "tests/main.rs"

# The benches are advisory, measured into BENCH.md and never a gate, DESIGN.md § Targets and kill
# conditions; benches/support/ holds the fixtures they share. `simd` is the SIMD kill condition,
# each tier's bulk entry against its one-at-a-time deposits, and the product-kernel row; `ops`
# re-takes the prototype table on the compact tier and `Wide` and counts the width caps; `dd_sum`
# is the differential-dataflow end-to-end `SUM` against `isize`; `wire` is timely's serialized
# exchange of a batch of `Exact` diffs alone, the three bincode passes of one crossing, against
# `isize` and two candidate forms. A requirement keeps a `--no-default-features` build of the
# benches from failing.
[[bench]]
name = "simd"
harness = false
required-features = ["simd"]

[[bench]]
name = "ops"
harness = false
required-features = ["std"]

[[bench]]
name = "dd_sum"
harness = false
required-features = ["differential"]

[[bench]]
name = "wire"
harness = false
required-features = ["differential"]

# The `explode` + `count_total` idiom, DESIGN.md § differential-dataflow: `cargo run --example
# dd_sum -- -w 3`. The self dev-dependency turns the feature on for a bare run; the requirement
# keeps `--no-default-features` builds of the examples from failing.
[[example]]
name = "dd_sum"
required-features = ["differential"]

# Feldera's `CREATE LINEAR AGGREGATE` route, DESIGN.md § DBSP: the accumulator type, `_map` and
# `_post` as udf.rs would hold them, driven through `aggregate_linear` by `main`:
# `cargo +1.99.0 run --features dbsp --example dbsp_uda`. A directory example, so the SQL and the
# udf.toml Feldera reads sit beside the Rust.
[[example]]
name = "dbsp_uda"
path = "examples/dbsp_uda/main.rs"
required-features = ["dbsp"]

[features]
default = ["std"]
# `std::error::Error` impls and the bench harness. Nothing in the crate allocates, so there is no
# `alloc` feature: every type is a plain word on every feature set.
std = []
# `Serialize`/`Deserialize` in the canonical encoding, validated on decode.
serde = ["dep:serde"]
# The differential-dataflow adapter: `Exact` as a diff type, DESIGN.md § differential-dataflow.
# `serde` because exchange between workers serialises the diff.
differential = ["dep:differential-dataflow", "serde"]
# The DBSP adapter: `Exact` as a `DBWeight`, DESIGN.md § DBSP, with rkyv's archived form and
# `OrdRepr` on it. dbsp is a `std` engine. Out of the self dev-dependency's list because it needs
# its own toolchain: `cargo +1.99.0 test --features dbsp --test main dbsp_`.
dbsp = ["dep:dbsp", "dep:rkyv", "dep:size-of", "std"]
# The laws kit, `float_abel::laws`: proptest checks of what an incremental engine asks of a weight,
# runnable against any type. proptest's runner wants `std`.
laws = ["dep:proptest", "std"]
# Runtime-dispatched NEON/AVX2/AVX-512 bulk kernels, the only `unsafe` in the crate. Runtime
# detection is `std::arch`'s macro, hence `std`.
simd = ["std"]
# Fuzz inputs.
arbitrary = ["dep:arbitrary", "std"]

# Debuginfo trimmed for the dev loop; the dependency graph carries none at all.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

[lints]
workspace = true

# Two test crates are workspace members because each reaches a build no `cargo test` of this package
# can: tests/noalloc builds the lib with no features (the self dev-dependency's `simd` pulls `std`),
# and tests/golden links the lib and a hasher alone, so it cross-compiles to wasm32 and the QEMU
# targets where tests/main.rs's engine dependencies cannot. A bare `cargo test` still runs this
# package alone, because a package at the workspace root is its default member.
[workspace]
members = ["tests/noalloc", "tests/golden"]
# The cargo-fuzz package stands alone: libFuzzer wants nightly and a sanitizer build, and its
# closure has no place in this lockfile, which the MSRV build parses whole.
exclude = ["fuzz"]

# Lints warn here and fail only at the gate (`cargo clippy --all-targets -- -D warnings` and
# `RUSTDOCFLAGS="-D warnings" cargo doc` in scripts/regression.sh). `unsafe_code` is denied in
# src/lib.rs, where src/simd/ can lift it.
[workspace.lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
